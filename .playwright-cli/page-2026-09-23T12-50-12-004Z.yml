        - generic [ref=f5e227]:
          - paragraph [ref=f5e228]: Em momentos de risco, informações importantes ficam espalhadas entre diferentes sites e redes sociais. Conteúdos antigos também podem reaparecer como se fossem atuais, gerando dúvida e preocupação.
          - paragraph [ref=f5e229]: Este sistema reúne, em um só lugar, dados atualizados sobre rios, chuva, barragens, alertas, radar e satélite. As informações vêm da ANA/SNIRH, SACE/SGB, Defesa Civil do RS, CERAN, INMET, CPTEC/INPE, Climatempo e Epagri/Ciram.
          - paragraph [ref=f5e230]: É uma ferramenta de apoio para facilitar o acesso à informação. Em uma emergência, siga sempre as orientações oficiais.
