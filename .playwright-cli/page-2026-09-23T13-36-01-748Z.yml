        - generic [ref=e476]:
          - paragraph [ref=e477]: Em momentos de risco, informações importantes ficam espalhadas entre diferentes sites e redes sociais. Conteúdos antigos também podem reaparecer como se fossem atuais, gerando dúvida e preocupação.
