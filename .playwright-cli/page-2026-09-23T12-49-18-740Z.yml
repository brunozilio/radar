          - paragraph [ref=e514]: Este sistema reúne, em um só lugar, dados atualizados sobre rios, chuva, barragens, alertas, radar e satélite. As informações vêm da ANA/SNIRH, SACE/SGB, Defesa Civil do RS, CERAN, INMET, CPTEC/INPE, Climatempo e Epagri/Ciram.
